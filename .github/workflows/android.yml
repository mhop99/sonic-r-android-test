
name: Build Sonic R Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" \
            "build-tools;35.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

      - name: Extract Sonic R project
        shell: bash
        run: |
          unzip -q sonic-r-android-*two-gamepads-test.zip -d extracted
          test -d extracted/sonic-r-android-1.3.1/sidecar
          test -f extracted/sonic-r-android-1.3.1/sidecar/Cargo.toml
          ls extracted

      - name: Add missing SDL2_mixer source
        shell: bash
        run: |
          cd extracted/sonic-r-android-1.3.1/sonic-r-main/source/android
          mkdir -p SDL2_mixer
          curl -fL --retry 3 -o /tmp/sdl2_mixer.tar.gz \
            https://github.com/libsdl-org/SDL_mixer/releases/download/release-2.8.1/SDL2_mixer-2.8.1.tar.gz
          tar -xzf /tmp/sdl2_mixer.tar.gz -C SDL2_mixer --strip-components=1
          test -f SDL2_mixer/CMakeLists.txt

      - name: Set up Rust Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android

      - name: Install cargo-ndk
        shell: bash
        run: |
          cargo install cargo-ndk --version 4.1.2 --locked

      - name: Build Rust Netplay library
        shell: bash
        run: |
          cd extracted/sonic-r-android-1.3.1/sidecar

          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          export CARGO_NDK_PLATFORM=21

          test -d "$ANDROID_NDK_HOME"

          mkdir -p ../app/src/main/jniLibs

          set -o pipefail
          cargo ndk \
            -t arm64-v8a \
            -t armeabi-v7a \
            -t x86_64 \
            -o ../app/src/main/jniLibs \
            build --release --locked 2>&1 | tee rust-build.log

          echo "=== Checking Rust libraries ==="

          for ABI in arm64-v8a armeabi-v7a x86_64; do
            test -s "../app/src/main/jniLibs/$ABI/libsonicr_netplay.so"
            echo "Found: $ABI/libsonicr_netplay.so"
          done

      - name: Build APK
        shell: bash
        run: |
          cd extracted/sonic-r-android-1.3.1/app
          chmod +x gradlew

          set -o pipefail
          ./gradlew assembleDebug --no-daemon --console=plain \
            2>&1 | tee build.log

      - name: Verify APK contents
        shell: bash
        run: |
          cd extracted/sonic-r-android-1.3.1/app

          APK=$(find build/outputs/apk/debug -maxdepth 1 -name '*.apk' -print -quit)
          test -n "$APK"

          echo "=== Checking APK: $APK ==="

          for ABI in arm64-v8a armeabi-v7a x86_64; do
            unzip -Z1 "$APK" | grep -Fxq "lib/$ABI/libsonicr_netplay.so"
            echo "APK contains: $ABI/libsonicr_netplay.so"
          done

      - name: Show failure logs
        if: failure()
        shell: bash
        run: |
          ROOT="extracted/sonic-r-android-1.3.1"

          for LOG in \
            "$ROOT/sidecar/rust-build.log" \
            "$ROOT/app/build.log"; do

            if [ -f "$LOG" ]; then
              echo "========== $LOG =========="
              tail -n 100 "$LOG"
            fi
          done

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SonicR-Test-APK
          path: extracted/sonic-r-android-1.3.1/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
