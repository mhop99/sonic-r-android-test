name: Build Sonic R Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK packages
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          ls -la "$SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;35.0.0" "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Extract Sonic R project
        run: |
          ls -la
          unzip -q sonic-r-android-*two-gamepads-test.zip -d extracted
          ls extracted

      - name: Build APK
        run: |
          cd extracted/sonic-r-android-1.3.1/app
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SonicR-Test-APK
          path: extracted/sonic-r-android-1.3.1/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
