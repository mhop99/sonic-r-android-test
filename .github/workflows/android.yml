name: Build Sonic R Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: |
          sdkmanager "platforms;android-34"
          sdkmanager "build-tools;35.0.0"
          sdkmanager "ndk;28.2.13676358"
          sdkmanager "cmake;3.22.1"

      - name: Extract Sonic R project
        run: |
          unzip -q sonic-r-android-1.3.1-two-gamepads-test.zip -d extracted

      - name: Build APK
        run: |
          cd extracted/sonic-r-android-1.3.1/app
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SonicR-Test-APK
          path: extracted/sonic-r-android-1.3.1/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
