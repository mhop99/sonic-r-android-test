name: Build Sonic R Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK packages
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;35.0.0" "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Extract Sonic R project
        run: |
          ZIP=$(ls sonic-r-android-v*.zip | sort -V | tail -n1)
          echo "Using $ZIP"
          unzip -q "$ZIP" -d extracted
          ls extracted

      - name: Add missing SDL2_mixer source
        run: |
          cd extracted/sonic-r-android-1.3.1/sonic-r-main/source/android
          mkdir -p SDL2_mixer
          curl -fL --retry 3 -o /tmp/sdl2_mixer.tar.gz https://github.com/libsdl-org/SDL_mixer/releases/download/release-2.8.1/SDL2_mixer-2.8.1.tar.gz
          tar -xzf /tmp/sdl2_mixer.tar.gz -C SDL2_mixer --strip-components=1
          ls SDL2_mixer
          test -f SDL2_mixer/CMakeLists.txt

      - name: Set up fixed signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          mkdir -p ~/.android
          echo "$KEYSTORE_B64" | base64 -d > /tmp/sonicr.keystore
          rm -f ~/.android/debug.keystore
          keytool -importkeystore -srckeystore /tmp/sonicr.keystore -srcstorepass "$KEYSTORE_PASS" -srcalias sonicr -destkeystore ~/.android/debug.keystore -deststoretype PKCS12 -deststorepass android -destalias androiddebugkey -noprompt
          keytool -list -keystore ~/.android/debug.keystore -storepass android | grep -i -E "androiddebugkey|Entry"

      - name: Build APK
        run: |
          cd extracted/sonic-r-android-1.3.1/app
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --console=plain 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      - name: Show failure reason
        if: failure()
        run: |
          cd extracted/sonic-r-android-1.3.1/app
          echo "=== WHAT WENT WRONG ==="
          grep -n -A 25 "What went wrong" build.log | head -80 || true
          echo "=== CMAKE / NINJA ERRORS ==="
          grep -n -E "CMake Error|error:|FAILED:" build.log | head -40 || true

      - name: Show signing certificate
        run: |
          APK=$(ls extracted/sonic-r-android-1.3.1/app/build/outputs/apk/debug/*.apk | head -n1)
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" | grep -i "SHA-256"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SonicR-Test-APK
          path: extracted/sonic-r-android-1.3.1/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
